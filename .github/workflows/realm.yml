# realm: the lockstep server, its tools and the Godot native module (realm/README.md).
# Linux runs realm/check.sh; Linux and Windows run the store's check (realm/store/check.sh) and build the native module, Windows builds the server and the
# load test for hosting on a Windows PC; `client-windows` exports the Godot client (realm/client) for Windows with
# the native module inside, an artifact to download and run to see the frame rate on a real card; both run the same bench and the hashes must match (lockstep needs
# every machine to compute the same field).
name: realm

on:
  push:
    branches: [main]
  pull_request:
  # Nightly (off since 27 Nov 2026, Horde & Hearth is shelved): the whole Windows suite, including the slow determinism
  # gates the push/PR Windows job skips. Run it by hand (workflow_dispatch), or put the schedule back when work resumes:
  #   schedule:
  #     - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain the module and the workspace are built and tested with (gdext 0.5.5 needs 1.94 or newer).
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: never
  # CI builds are one-shot: incremental data and debug info only slow them and bloat the cache.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The determinism probe: the same bench on every platform must end on the same hash.
  BENCH: --bench --bots=300 --monsters=8000 --rally=0.3 --threads=2 --ticks=200 --warmup=40 --report=100

concurrency:
  group: realm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: echo "v=$(git describe --always --dirty)" >> "$GITHUB_OUTPUT"
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: |
            realm
            realm/godot
            realm/store
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: realm/check.sh
        run: realm/check.sh
      - name: Native module
        working-directory: realm/godot
        run: |
          cargo build --release -j"$(nproc)" 2>&1 | tee build.log
          if grep -q "^warning" build.log; then echo "build warnings"; exit 1; fi
          cargo test --release -j"$(nproc)"
      - name: realm/store/check.sh
        run: realm/store/check.sh
      - name: Bench hash
        working-directory: realm
        run: ./target/release/realm-server $BENCH | grep "^BENCH" | grep -Eo "hash=[0-9a-f]+" > ../hash-linux.txt && cat ../hash-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: realm-godot-linux-${{ steps.ver.outputs.v }}
          path: realm/godot/target/release/librealm_godot.so
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hash-linux
          path: hash-linux.txt

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: echo "v=$(git describe --always --dirty)" >> "$GITHUB_OUTPUT"
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: |
            realm
            realm/godot
            realm/store
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Server and load test
        working-directory: realm
        run: |
          cargo build --release -j"$(nproc)" 2>&1 | tee build.log
          if grep -q "^warning" build.log; then echo "build warnings"; exit 1; fi
          # core/tests/gates.rs (256 s here) runs on Linux on every push and on Windows in the nightly run.
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            cargo test --release -j"$(nproc)"
          else
            cargo test --release -j"$(nproc)" -- --skip hash_equal_on_1_to_4_threads --skip a_run_of_the_bot_gates --skip a_lone_novice_kiting_bot --skip a_party_holds_the_middle_ring
          fi
      - name: Native module
        working-directory: realm/godot
        run: |
          cargo build --release -j"$(nproc)" 2>&1 | tee build.log
          if grep -q "^warning" build.log; then echo "build warnings"; exit 1; fi
          cargo test --release -j"$(nproc)"
      - name: realm/store/check.sh
        run: bash realm/store/check.sh
      - name: Bench hash
        working-directory: realm
        run: ./target/release/realm-server.exe $BENCH | grep "^BENCH" | grep -Eo "hash=[0-9a-f]+" > ../hash-windows.txt && cat ../hash-windows.txt
      - name: Host scripts parse (PowerShell)
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem realm/ops/host/*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs.Count) { $errs | Out-String; exit 1 }
            Write-Host "parsed $($f.Name)"
          }
      - name: Operations rehearsal (backup, wreck, restore, drill, release, rollback)
        working-directory: realm
        run: ./target/release/realm-ops.exe rehearse
      - name: Gather the server package
        run: |
          mkdir -p realm-server-windows
          cp realm/target/release/realm-server.exe realm/target/release/realm-loadtest.exe realm/target/release/realm-gateway.exe realm/store/target/release/realm-store.exe realm/run_server.bat realm-server-windows/
      - name: Gather the host package (scripts, config and releases/V in one folder)
        run: |
          cp realm/store/target/release/realm-store.exe realm/target/release/
          realm/target/release/realm-ops.exe package --bins=realm/target/release --out=realm-host-windows --version="${{ steps.ver.outputs.v }}" --host=realm/ops/host
      - uses: actions/upload-artifact@v4
        with:
          name: realm-server-windows-${{ steps.ver.outputs.v }}
          path: realm-server-windows
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: realm-host-windows-${{ steps.ver.outputs.v }}
          path: realm-host-windows
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: realm-godot-windows
          path: realm/godot/target/release/realm_godot.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hash-windows
          path: hash-windows.txt

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.7.2"
      GODOT: godot
    steps:
      - uses: actions/checkout@v4
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: |
            realm
            realm/godot
            realm/store
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-godot
      - name: realm/check_client.sh
        run: xvfb-run -a realm/check_client.sh

  client-windows:
    needs: [windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: echo "v=$(git describe --always --dirty)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: realm-godot-windows
          path: realm/client/bin
      - name: Godot and its Windows export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -q -j templates.tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" -d "$dir"
      - name: Import and export the client
        run: |
          # The first import of a fresh clone does its work and then aborts while quitting: the second is clean.
          godot --headless --path realm/client --import || true
          godot --headless --path realm/client --import
          test -f realm/client/.godot/extension_list.cfg
          mkdir -p build/realm-client
          godot --headless --path realm/client --export-release "Windows Desktop" ../../build/realm-client/HordeAndHearth.exe
          cp realm/client/bin/realm_godot.dll build/realm-client/
          ls -l build/realm-client
      - name: Export the playtest kit (debug build, trusts the LAN server's own certificate; realm/playtest)
        run: |
          mkdir -p build/realm-playtest
          godot --headless --path realm/client --export-debug "Windows Desktop" ../../build/realm-playtest/HordeAndHearth.exe
          cp realm/client/bin/realm_godot.dll realm/playtest/Play.cmd realm/playtest/play.ps1 realm/playtest/README.txt build/realm-playtest/
          ls -l build/realm-playtest
      - uses: actions/upload-artifact@v4
        with:
          name: realm-client-windows-${{ steps.ver.outputs.v }}
          path: build/realm-client
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: realm-playtest-windows-${{ steps.ver.outputs.v }}
          path: build/realm-playtest
          if-no-files-found: error

  # Licences, advisories, duplicate versions and sources of every crate we depend on (realm/deny.toml): the workspace and the
  # two workspaces of their own (the Godot module and the store). cargo-deny (MIT/Apache) comes as its prebuilt musl binary,
  # pinned by version and checked against the SHA-256 of the archive.
  # The walk animator's rule gate (tools/animator/RULES.md): every rule has a failing example that must stay refused.
  animator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3 pillow==11.0.0
      - run: python3 -m unittest discover tools/animator/tests

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: "0.18.9"
      CARGO_DENY_SHA256: "491d04e4c05d7c92582e3d40ec94126c52472a546326a6d29473a5a4e73babd2"
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny ${{ env.CARGO_DENY_VERSION }}
        run: |
          f="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/deny.tgz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$f.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin" && mv "$RUNNER_TEMP/$f/cargo-deny" "$HOME/.local/bin/" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: cargo deny check (workspace)
        working-directory: realm
        run: cargo deny check
      - name: cargo deny check (Godot module)
        working-directory: realm
        run: cargo deny --manifest-path godot/Cargo.toml check
      - name: cargo deny check (store)
        working-directory: realm
        run: cargo deny --manifest-path store/Cargo.toml check

  same-hash:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          merge-multiple: true
      - name: Linux and Windows compute the same field
        run: |
          cat hash-linux.txt hash-windows.txt
          cmp hash-linux.txt hash-windows.txt
