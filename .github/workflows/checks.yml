# Every check as a parallel job matrix, one GitHub runner per job. Locally the same checks run together with
# tools/check_all.sh; here each one gets its own machine.
name: checks

# Four of Wands is stopped (21 Nov 2026): these checks run only when something they test changes, so Horde & Hearth
# merges (realm/, docs/) do not spend runners on a game nobody is changing. realm.yml tests realm/.
on:
  push:
    branches: [main]
    paths-ignore: ['realm/**', 'docs/**', 'tools/station/**', 'tools/ops_board/**', '*.md', '.github/workflows/realm.yml']
  pull_request:
    paths-ignore: ['realm/**', 'docs/**', 'tools/station/**', 'tools/ops_board/**', '*.md', '.github/workflows/realm.yml']
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT: godot

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: unit, cmd: "tools/run_tests.sh" }
          - { name: lint, cmd: "tools/lint.sh" }
          # sim_horde asserts a time budget, so it gets a runner to itself; every other sim runs in the "sims" row.
          - { name: sims, cmd: "tools/run_sims.sh --except=sim_horde" }
          - { name: sims-horde, cmd: "tools/run_sims.sh sim_horde" }
          # Play-bot fan-out: one runner per shard (shard n plays seed 101+n with 1+n%4 wizards). Keep --nshards
          # equal to the number of rows.
          - { name: bot-0, cmd: "timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --shard=0 --nshards=3 | tee out.log; grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log" }
          - { name: bot-1, cmd: "timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --shard=1 --nshards=3 | tee out.log; grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log" }
          - { name: bot-2, cmd: "timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --shard=2 --nshards=3 | tee out.log; grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Run ${{ matrix.name }}
        shell: bash
        run: |
          set -o pipefail
          tools/import.sh  # imports once and leaves a stamp, so the tool below does not import again
          bash -c "${{ matrix.cmd }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: out.log
          if-no-files-found: ignore
