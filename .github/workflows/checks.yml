# Every check as a parallel job matrix, one GitHub runner per job. Locally the same checks run together with
# tools/check_all.sh; here each one gets its own machine.
name: checks

# The rule on main requires these jobs on every pull request: unit, lint, sims, sims-horde, bot-0..2 (and realm.yml's
# linux, windows, same-hash, client-windows), so this workflow must run on all of them: with a paths filter here a
# change to realm/ alone could never be merged. bot-heroes, bot-boss, bot-win and bot-again run on every pull request
# too but are not in the rule yet: adding them is the owner's step in the repository's rules. Until then read their
# result before a merge; the stations' `checks` role runs them on every merge (tools/check_all.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT: godot

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: unit, cmd: "tools/run_tests.sh" }
          - { name: lint, cmd: "tools/lint.sh" }
          # sim_horde asserts a time budget, so it gets a runner to itself; every other sim runs in the "sims" row.
          - { name: sims, cmd: "tools/run_sims.sh --except=sim_horde" }
          - { name: sims-horde, cmd: "tools/run_sims.sh sim_horde" }
          # Play-bot fan-out: one runner per shard (shard n plays seed 101+n with 1+n%4 wizards). Keep --nshards
          # equal to the number of rows of shards 0 to 2; bot-heroes, bot-boss, bot-win and bot-again (saved heroes, a private save folder) are rows of their own.
          # A bot row also fails on an engine error line (tests/bot/no_engine_errors.sh).
          - { name: bot-0, cmd: "timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --shard=0 --nshards=3 | tee out.log; grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log && tests/bot/no_engine_errors.sh out.log" }
          - { name: bot-1, cmd: "timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --shard=1 --nshards=3 | tee out.log; grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log && tests/bot/no_engine_errors.sh out.log" }
          - { name: bot-2, cmd: "timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --shard=2 --nshards=3 | tee out.log; grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log && tests/bot/no_engine_errors.sh out.log" }
          - { name: bot-heroes, cmd: "XDG_DATA_HOME=$(mktemp -d) timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --heroes | tee out.log; grep -q '^BOT heroes PASS ' out.log && grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log && tests/bot/no_engine_errors.sh out.log" }
          - { name: bot-boss, cmd: "XDG_DATA_HOME=$(mktemp -d) timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --boss | tee out.log; grep -q '^BOT boss PASS ' out.log && grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log && tests/bot/no_engine_errors.sh out.log" }
          - { name: bot-win, cmd: "XDG_DATA_HOME=$(mktemp -d) timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --win | tee out.log; grep -q '^BOT win PASS ' out.log && grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log && tests/bot/no_engine_errors.sh out.log" }
          - { name: bot-again, cmd: "XDG_DATA_HOME=$(mktemp -d) timeout 300 godot --headless --fixed-fps 60 --path . res://tests/bot/bot.tscn -- --again | tee out.log; grep -q '^BOT again PASS ' out.log && grep -q '^BOT score=' out.log && ! grep -q '^BOT .* FAIL ' out.log && tests/bot/no_engine_errors.sh out.log" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Run ${{ matrix.name }}
        shell: bash
        run: |
          set -o pipefail
          tools/import.sh  # imports once and leaves a stamp, so the tool below does not import again
          bash -c "${{ matrix.cmd }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: out.log
          if-no-files-found: ignore
