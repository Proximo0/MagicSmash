name: setup-godot
description: Install the pinned headless-capable Godot editor binary as `godot` (cached between runs). Linux and Windows runners.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/godot-bin
        key: godot-${{ env.GODOT_VERSION }}-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot-bin && cd ~/godot-bin
        base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
        if [ "$RUNNER_OS" = Windows ]; then
          # The main program keeps a pipe it is given, so `godot | grep` works without the console wrapper.
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          unzip -q godot.zip 2>/dev/null || 7z x -y godot.zip >/dev/null
          rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_win64.exe" godot.exe
          rm -f "Godot_v${GODOT_VERSION}-stable_win64_console.exe"
        else
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
        fi
    - name: Put godot on PATH
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$HOME/godot-bin" >> "$GITHUB_PATH"; else echo "$HOME/godot-bin" >> "$GITHUB_PATH"; fi
