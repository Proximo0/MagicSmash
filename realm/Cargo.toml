[workspace]
resolver = "2"
members = ["core", "server", "loadtest"]
# The Godot module has its own workspace (it is the one crate with a crates.io dependency).
exclude = ["godot"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
debug = false
codegen-units = 4

[profile.test]
opt-level = 2
