[package]
name = "realm-gateway"
edition.workspace = true
version.workspace = true
description = "Horde & Hearth gateway: accounts, heroes, towns, field tickets and field hosts in one process."

[lib]
name = "realm_gateway"

[[bin]]
name = "realm-gateway"
path = "src/main.rs"

[[bin]]
name = "realm-soak"
path = "src/soak.rs"

[[bin]]
name = "realm-world"
path = "src/world_bin.rs"

[[bin]]
name = "realm-economy"
path = "src/economy_bin.rs"

[dependencies]
realm-core = { path = "../core" }
realm-server = { path = "../server" }
realm-store = { path = "../store" }
realm-loot = { path = "../loot" }
realm-ops = { path = "../ops" }
# Transport security (docs/realm/wire.md "Transport security"): rustls on the ring provider (no cmake, NASM or
# OpenSSL on Windows), webpki-roots for a launch certificate, rcgen for `--dev-cert` (local play and tests).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
